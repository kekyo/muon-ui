name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.3'

      - name: Prepare Android manufacturer toolchain
        shell: bash
        run: |
          cli_root="${RUNNER_TEMP}/muon-android-cli"
          mkdir -p "${cli_root}"
          curl --fail --location --silent --show-error \
            https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip \
            -o "${cli_root}/tools.zip"
          echo "0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8  ${cli_root}/tools.zip" | sha256sum --check
          unzip -q "${cli_root}/tools.zip" -d "${cli_root}"
          # android-emulator-runner prepends this SDK directory to PATH.
          cli_latest="${ANDROID_HOME}/cmdline-tools/latest"
          mkdir -p "${ANDROID_HOME}/cmdline-tools"
          if [ -e "${cli_latest}" ] || [ -L "${cli_latest}" ]; then
            mv "${cli_latest}" "${cli_root}/previous-cmdline-tools"
          fi
          mv "${cli_root}/cmdline-tools" "${cli_latest}"
          echo "${cli_latest}/bin" >> "${GITHUB_PATH}"
          # CI provisions the manufacturer's SDK explicitly. Consumer prepare only diagnoses it.
          set +o pipefail
          yes | "${cli_latest}/bin/android" --sdk="${ANDROID_HOME}" sdk install \
            platforms/android-37.0 build-tools/36.0.0 platform-tools \
            ndk/29.0.14206865 cmake/4.1.2
          exit "${PIPESTATUS[1]}"

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            at-spi2-core \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            dbus \
            file \
            ffmpeg \
            g++-mingw-w64 \
            git \
            libasound2-dev \
            libdrm-dev \
            libgbm-dev \
            libgtk-3-dev \
            libnss3-dev \
            libxss-dev \
            ninja-build \
            podman \
            wine \
            wine32:i386 \
            wine64 \
            x11-utils \
            xdotool \
            xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Identify native toolchain
        id: native-toolchain
        shell: bash
        run: |
          tools=(
            gcc
            ar
            ranlib
            i686-w64-mingw32-gcc
            i686-w64-mingw32-ar
            i686-w64-mingw32-ranlib
            x86_64-w64-mingw32-gcc
            x86_64-w64-mingw32-ar
            x86_64-w64-mingw32-ranlib
          )
          fingerprint="$(
            {
              for tool in "${tools[@]}"; do
                command -v "${tool}"
                "${tool}" --version
              done
            } | sha256sum | cut -d ' ' -f 1
          )"
          echo "fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"

      - name: Cache CEF
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |-
            ~/.cache/muon/cef-catalog.json
            ~/.cache/muon/artifacts/cef
            core/cef/.cef
          key: ${{ runner.os }}-${{ runner.arch }}-cef-linux64-v1-${{ hashFiles('core/cef/build.sh', 'builder/src/prepare_cef.c', 'builder/src/prepare_cef.h') }}

      - name: Cache native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |-
            builder/.deps
            core/cef/.deps/*.tar.gz
            core/cef/.deps/src
          key: ${{ runner.os }}-${{ runner.arch }}-native-deps-v1-${{ steps.native-toolchain.outputs.fingerprint }}-${{ hashFiles('builder/build.sh', 'builder/build_*.sh', 'core/cef/build_*.sh') }}

      - name: Cache verified AppImage tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/muon/appimage
          key: ${{ runner.os }}-${{ runner.arch }}-appimage-${{ hashFiles('ui/cef/appimage-tools.ts') }}

      - name: Prepare independent plugin SDK targets
        run: |
          npm run build --workspace muon-plugin-sdk
          node sdk/scripts/stage-native.mjs windows-i686
          node sdk/scripts/stage-native.mjs windows-amd64
          node sdk/scripts/stage-native.mjs android-arm64-v8a
          node sdk/scripts/stage-native.mjs android-x86_64

      - name: Build and test
        run: npm run test

      - name: Test independent plugin toolchains and prepare consumer runtime
        run: |
          node sdk/scripts/test-target.mjs linux-amd64
          xvfb-run -a node sdk/scripts/test-target.mjs windows-i686
          xvfb-run -a node sdk/scripts/test-target.mjs windows-amd64
          node sdk/scripts/test-target.mjs android-arm64-v8a --compile-only
          bash prereq.sh --arch amd64 --jobs 2
          bash build_package.sh --target dist --arch amd64 --jobs 2
          npm run verify:package-runtime --workspace muon-ui -- linux-amd64 windows-i686 windows-amd64
          node sdk/scripts/stage-package.mjs linux-amd64 android-arm64-v8a android-x86_64
          node sdk/scripts/verify-package.mjs linux-amd64 windows-i686 windows-amd64 android-arm64-v8a android-x86_64

      - name: Test Linux packages from the independent npm consumer
        run: |
          mkdir -p .run/linux-package-ci
          npm pack --workspace muon-ui --ignore-scripts --pack-destination .run/linux-package-ci
          node ui/cef-test/test-packaged-appimage.mts .run/linux-package-ci/muon-ui-*.tgz linux-amd64

      - name: Enable KVM for Android E2E
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-muon-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test Android runtime and independent npm consumer
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.0'
          system-image-api-level: '37.1'
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader -no-snapshot -no-audio -no-boot-anim
          disable-animations: false
          script: |
            test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = 16384
            adb shell df -h /data
            npm run test:android --workspace muon-android-tester
            npm run test:android --workspace muon-android-poc
            node core/android-test/scripts/test-fullscreen-video.mjs .run/android-ci/fullscreen
            mkdir -p .run/android-ci
            npm pack --workspace muon-ui --pack-destination .run/android-ci
            node ui/android-test/test-packaged-application.mjs .run/android-ci/muon-ui-*.tgz --plugins
            node ui/android-test/test-packaged-application.mjs .run/android-ci/muon-ui-*.tgz --plugins --validate
            node sdk/scripts/test-target.mjs android-x86_64
            xvfb-run -a node sdk/scripts/test-consumer.mjs core/cef/dist-linux-amd64

  codeql:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - c-cpp
          - javascript-typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          build-mode: none
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:${{ matrix.language }}
